<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">PERSONAL FINANCE</p>
      <h1>Expense Tracker</h1>
      <p class="subtitle">Keep a clear view of your everyday spending.</p>
    </header>
    <section class="summary">
      <span>Total expenses</span>
      <strong id="total">₹0.00</strong>
    </section>
    <form id="expense-form">
      <label>Description<input id="description" maxlength="70" placeholder="e.g. Bus fare" required></label>
      <label>Amount (₹)<input id="amount" type="number" min="0.01" step="0.01" placeholder="100" required></label>
      <label>Category
        <select id="category">
          <option>Food</option><option>Travel</option><option>Shopping</option>
          <option>Bills</option><option>Other</option>
        </select>
      </label>
      <button type="submit">Add expense</button>
    </form>
    <h2>Recent expenses</h2>
    <ul id="expense-list" aria-live="polite"></ul>
    <p id="empty-state">No expenses added yet.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
